buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://api.modrinth.com/maven' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

plugins {
    id 'maven-publish'
}

def minecraftVer = stonecutter.current.version
def versionRange = project.findProperty("version_range") ?: minecraftVer

version = project.mod_version
group = project.maven_group

// 26.1+ 原生使用官方(Mojang)名，直接走 fabric-loom（不需要 official -> intermediary 重映射）。
apply plugin: 'net.fabricmc.fabric-loom'

base {
    archivesName = "${project.archives_base_name}-${versionRange}"
}

repositories {
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

// 文件名必须与 fabric.mod.json 里声明的一致：loom 按该名字把它复制进 jar。
def awFile = sc.process(rootProject.file("src/main/resources/fastrestart.classtweaker"),
        ".gradle/aw/fastrestart.classtweaker")

loom {
    accessWidenerPath = awFile

    mods {
        "fastrestart" {
            sourceSet sourceSets.main
        }
    }

    runConfigs.all {
        ideConfigGenerated true
        runDir "../../run"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.project}"
    implementation "net.fabricmc:fabric-loader:${property("loader_version")}"
}

processResources {
    inputs.property "minecraft", stonecutter.current.version

    filesMatching("fabric.mod.json") {
        expand([
                "minecraftVer": project.findProperty("minecraft_ver") ?: stonecutter.current.version,
                "modVer"      : mod_version
        ])
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
